name: Report a bug
description: Tell us what went wrong and how to reproduce it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include keys, local settings, private log entries, or launch addresses.
        For sensitive security problems, use the private route in SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a short, original spoken example if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include the exact error with private information removed.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Picard Code version or commit, operating system, browser, OpenCode version, model provider, and listening/speaking services. No account IDs or keys.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Checks or other evidence
      description: Say whether this used real speech, a physical microphone, or test stand-ins. Share only material you have permission to publish.
