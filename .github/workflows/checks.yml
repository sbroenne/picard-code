name: Project checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Release pull request receiving these check results
        type: number
        required: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Choose checks for changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Get the source and comparison commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check workflow and changed-file rules
        run: node --test .github/scripts/*.test.mjs
      - name: Choose the checks
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/check-scope.mjs

  # Things that can differ between computers: OpenCode packages, paths and starting programs.
  # Each system tests one Node version, so the oldest and newest supported versions are both covered.
  systems:
    name: Test server and package (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "24"
          - os: windows-latest
            node: "24"
          - os: macos-latest
            node: lts/*
    defaults:
      run:
        shell: bash
    steps:
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Run server tests
        run: npm test
      - name: Check the npm package runs with npx
        run: |
          mkdir -p ../package-check
          file=$(npm pack --ignore-scripts --pack-destination ../package-check | tail -n 1)
          cd ../package-check
          tar -tzf "$file" > files.txt
          grep -qx "package/web-dist/index.html" files.txt
          if grep -q "^package/dist/tests/" files.txt; then echo "Test files must not be in the package."; exit 1; fi
          npx --yes "./$file" opencode --version

  # Fixed names keep the existing merge requirements intact even when the matrix is skipped.
  ubuntu:
    name: Server and package (ubuntu-latest)
    needs: [changes, systems]
    if: always() && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          RESULT: ${{ needs.systems.result }}
        run: test "$RESULT" = success

  windows:
    name: Server and package (windows-latest)
    needs: [changes, systems]
    if: always() && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          RESULT: ${{ needs.systems.result }}
        run: test "$RESULT" = success

  macos:
    name: Server and package (macos-latest)
    needs: [changes, systems]
    if: always() && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          RESULT: ${{ needs.systems.result }}
        run: test "$RESULT" = success

  # The browser checks use a test stand-in for OpenCode, so they run once.
  browser:
    name: Types and browser checks
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a successful changed-file check
        env:
          RESULT: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
        run: test "$RESULT" = success && { test "$FULL" = true || test "$FULL" = false; }
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Check types
        if: needs.changes.outputs.full == 'true'
        run: npm run check
      - name: Build
        if: needs.changes.outputs.full == 'true'
        run: npm run build
      - name: Check the desktop app and project website
        if: needs.changes.outputs.full == 'true'
        run: npx playwright test
      - name: Check documentation links and the project website
        if: needs.changes.outputs.full != 'true'
        run: npx playwright test browser-tests/site.spec.ts
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  release-results:
    name: Report release checks
    needs: [changes, systems, browser]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pull-request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Get the reporting script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report the real results on the identical test-merge files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.pull-request }}
          CHECKED_SHA: ${{ github.sha }}
          SYSTEMS_RESULT: ${{ needs.systems.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/report-release-checks.mjs
