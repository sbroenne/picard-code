name: Publish to npm

# Started by Create release on the tag v<version>, for example v1701.4.1.
# npm accepts it through trusted publishing, so no npm token is stored in GitHub.
# The version is only staged; it goes public when the owner approves it on npm.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'sbroenne/picard-code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches the package version and has release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then echo "The release tag $TAG does not match package.json (v$version)."; exit 1; fi
          if ! grep -qxF "## $version" CHANGELOG.md; then echo "CHANGELOG.md has no release notes for $version."; exit 1; fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run check
      - name: Build
        run: npm run build
      - name: Run server tests
        run: npm test
      - name: Stage on npm for the owner's approval
        run: npm stage publish
