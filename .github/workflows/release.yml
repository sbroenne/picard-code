name: Publish to npm

# Runs when the owner publishes a GitHub release tagged v<version>, for example v0.2.0.
# npm accepts it through trusted publishing, so no npm token is stored in GitHub.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'sbroenne/picard-code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then echo "The release tag $TAG does not match package.json ($expected)."; exit 1; fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run check
      - name: Build
        run: npm run build
      - name: Run server tests
        run: npm test
      - name: Publish
        run: npm publish
