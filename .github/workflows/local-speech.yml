name: Real local speech

on:
  workflow_call:

permissions:
  contents: read

jobs:
  speech:
    name: Local speech (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore public speech models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.picard-code/voice/models/*.onnx
            ~/.picard-code/voice/models/*.bin
            ~/.picard-code/voice/models/*.gguf
            ~/.picard-code/voice/models/*LICENSE*
            ~/.picard-code/voice/models/*License*
            ~/.picard-code/voice/models/*NOTICE*
          key: speech-models-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-nemotron.mjs', 'scripts/setup-turn.mjs', 'scripts/setup-local-speech.py') }}
      - name: Prepare speech and verify cached models
        run: npm run setup:speech
      - name: Build
        run: npm run build
      - name: Check real listening, speaking and pause detection
        run: npm run test:speech:local
      - name: Show native Mac startup details after failure
        if: failure() && runner.os == 'macOS'
        run: |
          node --input-type=module <<'JS'
          import { spawn, spawnSync } from "node:child_process";
          import { homedir } from "node:os";
          import { dirname, join } from "node:path";
          import { setTimeout as wait } from "node:timers/promises";
          import { NEMOTRON_VERSION, NEMOTRON_MODEL } from "./scripts/setup-nemotron.mjs";
          const voice = join(homedir(), ".picard-code", "voice");
          const program = join(voice, "nemotron", NEMOTRON_VERSION, "bin", "nemo-speech");
          for (const threads of [4, 3, 1]) {
            console.log(`Checking native startup with ${threads} CPU threads.`);
            const child = spawn(program,
              ["serve", "--host", "127.0.0.1", "--port", "18791",
               "--asr-model", join(voice, "models", NEMOTRON_MODEL),
               "--gpu", "-1", "--asr.backend.threads", String(threads), "--asr.endpointing.enable=false",
               "--asr.batching.enabled=false", "--no-ui"],
              { cwd: dirname(program), stdio: "inherit" });
            child.on("error", (error) => { console.error(error); process.exitCode = 1; });
            const exited = new Promise((resolve) => child.once("close", resolve));
            try {
              await wait(15_000);
              try {
                const ready = await fetch("http://127.0.0.1:18791/ready", { signal: AbortSignal.timeout(1000) });
                console.log(`Native readiness: HTTP ${ready.status}, ${await ready.text()}`);
              } catch (error) { console.error("Native readiness probe failed:", error); }
              if (child.pid && child.exitCode === null) {
                const sample = spawnSync("sample", [String(child.pid), "1", "1", "-file", "/dev/stdout"],
                  { stdio: "inherit", timeout: 10_000 });
                if (sample.error) throw sample.error;
                if (sample.status !== 0) throw new Error(`Native sampling exited with ${sample.status}.`);
              }
            } finally { child.kill("SIGKILL"); await exited; }
          }
          JS
