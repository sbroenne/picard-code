version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node.js types follow the oldest supported Node.js (24), so code cannot use newer features.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The per-computer OpenCode packages must ask for the same minimum version.
      opencode:
        patterns: ["@opencode/cli-*"]
      development-tools:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
