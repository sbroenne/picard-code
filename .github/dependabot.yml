version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # OpenCode is upgraded by hand: its setup script approval names the exact
    # version, and the stand-in checks cannot prove a new version works.
    ignore:
      - dependency-name: "@opencode/cli"
    groups:
      development-tools:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
