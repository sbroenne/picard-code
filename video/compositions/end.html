<template id="end-template">
  <div data-composition-id="end" data-width="1920" data-height="1080" data-duration="15">
    <canvas class="space" width="1920" height="1080" data-layout-allow-overflow></canvas>

    <div class="board" data-hold>
      <div class="info">
        <span class="bar"></span>
        <h1>Picard Code</h1>
        <p class="lead">A full coding agent you command by voice.</p>
        <p class="command">npx picard-code</p>
        <p class="site">sbroenne.github.io/picard-code</p>
        <p class="free">Free and open source · Built on OpenCode 2</p>
      </div>
      <div class="slots">
        <div class="slot video"><span>Watch next</span></div>
        <div class="slot subscribe"><span>Subscribe</span></div>
      </div>
    </div>

    <div class="thanks" data-hold>
      <h2>Thank you, Sir Patrick.<br>Thank you, Captain.</h2>
      <p>Unofficial fan tribute. Not affiliated with Sir Patrick Stewart or the Star Trek rights holders.</p>
    </div>

    <style>
      [data-composition-id="end"] { background: #000; overflow: hidden; font-family: "Oswald", sans-serif; }
      [data-composition-id="end"] .space { position: absolute; inset: 0; }
      [data-composition-id="end"] .board { position: absolute; inset: 0; opacity: 0; }
      [data-composition-id="end"] .info { position: absolute; left: 140px; top: 190px; width: 900px; display: grid; gap: 26px; }
      [data-composition-id="end"] .bar { display: block; width: 520px; height: 26px; border-radius: 13px; background: #ff9c33; }
      [data-composition-id="end"] h1 { margin: 0; color: #ff9c33; font-size: 140px; font-weight: 600; line-height: 1; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
      [data-composition-id="end"] .lead { margin: 0; color: #ffcc99; font-size: 50px; line-height: 1.2; letter-spacing: .03em; }
      [data-composition-id="end"] .command { justify-self: start; margin: 20px 0 0; padding: 16px 38px; border-radius: 48px; background: #ffaa00; color: #000; font: 600 58px/1 "JetBrains Mono", monospace; }
      [data-composition-id="end"] .site { margin: 0; color: #9999ff; font: 40px/1.3 "Inter", sans-serif; }
      [data-composition-id="end"] .free { margin: 0; color: #b8aa9c; font-size: 34px; letter-spacing: .12em; text-transform: uppercase; }
      [data-composition-id="end"] .slots { position: absolute; left: 1160px; top: 170px; width: 640px; display: grid; gap: 50px; justify-items: center; }
      [data-composition-id="end"] .slot { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 18px; border: 6px solid #cc99cc; }
      [data-composition-id="end"] .slot span { color: #cc99cc; font-size: 30px; letter-spacing: .16em; text-transform: uppercase; }
      [data-composition-id="end"] .video { width: 640px; height: 360px; border-radius: 0 40px 40px 0; border-left: 40px solid #cc99cc; }
      [data-composition-id="end"] .subscribe { width: 240px; height: 240px; border-radius: 50%; border-color: #9999ff; align-items: center; padding: 0; }
      [data-composition-id="end"] .subscribe span { color: #9999ff; }
      [data-composition-id="end"] .thanks { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 60px; opacity: 0; text-align: center; }
      [data-composition-id="end"] h2 { margin: 0; color: #ffaa00; font-size: 110px; font-weight: 600; line-height: 1.12; letter-spacing: .04em; text-transform: uppercase; }
      [data-composition-id="end"] .thanks p { margin: 0; color: #b8aa9c; font: 28px/1.4 "Inter", sans-serif; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="end"]');
        let seed = 7401;
        const next = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const stars = Array.from({ length: 300 }, () => ({ x: next() * 1920, y: next() * 1080, z: 0.3 + next() * 0.7 }));
        const context = root.querySelector(".space").getContext("2d");
        const warp = { stretch: 0, shift: 0, fade: 1 };
        const draw = () => {
          context.fillStyle = "#000";
          context.fillRect(0, 0, 1920, 1080);
          context.fillStyle = "#f2e6da";
          for (const star of stars) {
            const x = star.x - warp.shift * star.z * 4000;
            const length = 2 + warp.stretch * star.z * 900;
            context.globalAlpha = (0.3 + star.z * 0.6) * warp.fade;
            context.fillRect(x - length, star.y, length, star.z * 2.2);
          }
          context.globalAlpha = 1;
        };

        const q = (selector) => root.querySelectorAll(selector);
        const tl = gsap.timeline({ paused: true, onUpdate: draw });
        // The thank-you for five seconds, then ten seconds of end board for YouTube's end screen.
        tl.to(warp, { fade: 0.45, duration: 1 }, 0);
        tl.fromTo(q(".thanks"), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.2);
        tl.to(q(".thanks"), { opacity: 0, duration: 0.5, ease: "power2.in" }, 4.5);
        tl.fromTo(q(".board"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 5);
        tl.fromTo(q(".info > *"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, stagger: 0.15, ease: "power2.out" }, 5.1);
        tl.fromTo(q(".slot"), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.6, stagger: 0.2, ease: "power2.out" }, 5.3);
        draw();
        window.__timelines = window.__timelines || {};
        window.__timelines["end"] = tl;
      })();
    </script>
  </div>
</template>
