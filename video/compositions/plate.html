<template id="plate-template">
  <div data-composition-id="plate" data-width="1920" data-height="1080" data-duration="3">
    <div class="plate">
      <span class="cap"></span>
      <div class="words">
        <strong class="name"></strong>
        <span class="duty"></span>
      </div>
    </div>

    <style>
      [data-composition-id="plate"] { background: transparent; pointer-events: none; font-family: "Oswald", sans-serif; text-transform: uppercase; }
      [data-composition-id="plate"] .plate { position: absolute; left: 96px; bottom: 120px; display: flex; align-items: stretch; height: 116px; background: #000; border-radius: 58px 0 0 58px; box-shadow: 0 0 0 4px #000; opacity: 0; }
      [data-composition-id="plate"] .cap { width: 116px; border-radius: 58px 0 0 58px; background: var(--colour, #ff9c33); }
      [data-composition-id="plate"] .words { display: flex; flex-direction: column; justify-content: center; padding: 0 44px 0 26px; border-top: 8px solid var(--colour, #ff9c33); border-bottom: 8px solid var(--colour, #ff9c33); }
      [data-composition-id="plate"] .name { color: var(--colour, #ff9c33); font-size: 54px; font-weight: 600; line-height: 1; letter-spacing: .08em; white-space: nowrap; }
      [data-composition-id="plate"] .duty { color: #f2e6da; font-size: 30px; letter-spacing: .14em; line-height: 1.3; white-space: nowrap; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="plate"]');
        const values = window.__hyperframes?.getVariables?.() ?? {};
        root.querySelector(".name").textContent = values.name ?? "";
        root.querySelector(".duty").textContent = values.duty ?? "";
        root.style.setProperty("--colour", values.colour ?? "#ff9c33");
        const q = (selector) => root.querySelectorAll(selector);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(q(".plate"), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0);
        tl.to(q(".plate"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 2.7);
        window.__timelines = window.__timelines || {};
        window.__timelines["plate"] = tl;
      })();
    </script>
  </div>
</template>
