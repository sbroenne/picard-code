<template id="title-template">
  <div data-composition-id="title" data-width="1920" data-height="1080" data-duration="4">
    <canvas class="space" width="1920" height="1080" data-layout-allow-overflow></canvas>
    <div class="flash"></div>
    <div class="words">
      <h1>Picard Code</h1>
      <p>A full coding agent you command by voice</p>
      <p class="built">Built on OpenCode 2</p>
    </div>

    <style>
      [data-composition-id="title"] { background: #000; overflow: hidden; }
      [data-composition-id="title"] .space { position: absolute; inset: 0; }
      [data-composition-id="title"] .flash { position: absolute; left: 0; right: 0; top: 520px; height: 40px; background: linear-gradient(90deg, transparent, #9999ff 30%, #ffffff 50%, #9999ff 70%, transparent); filter: blur(10px); opacity: 0; transform-origin: 50% 50%; }
      [data-composition-id="title"] .words { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
      [data-composition-id="title"] h1 { margin: 0; color: #ff9c33; font: 600 190px/1 "Oswald", sans-serif; letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; opacity: 0; }
      [data-composition-id="title"] p { margin: 0; color: #ffcc99; font: 300 56px/1.2 "Oswald", sans-serif; letter-spacing: .08em; opacity: 0; }
      [data-composition-id="title"] p.built { margin-top: -18px; color: #9999ff; font-size: 40px; letter-spacing: .18em; text-transform: uppercase; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="title"]');
        let seed = 2364;
        const next = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const stars = Array.from({ length: 360 }, () => ({ angle: next() * Math.PI * 2, depth: next(), size: 0.6 + next() * 1.8 }));
        const context = root.querySelector(".space").getContext("2d");
        const warp = { speed: 0, travel: 0 };
        const draw = () => {
          context.fillStyle = "#000";
          context.fillRect(0, 0, 1920, 1080);
          context.strokeStyle = "#e6e6ff";
          for (const star of stars) {
            const depth = (star.depth + warp.travel) % 1;
            const radius = 40 + depth * depth * 1500;
            const tail = Math.min(radius - 40, warp.speed * 900 * depth);
            const cos = Math.cos(star.angle);
            const sin = Math.sin(star.angle);
            context.globalAlpha = Math.min(1, 0.2 + depth);
            context.lineWidth = star.size * (0.6 + depth);
            context.beginPath();
            context.moveTo(960 + cos * radius, 540 + sin * radius);
            context.lineTo(960 + cos * (radius - tail - 1), 540 + sin * (radius - tail - 1));
            context.stroke();
          }
          context.globalAlpha = 1;
        };

        const q = (selector) => root.querySelectorAll(selector);
        const tl = gsap.timeline({ paused: true, onUpdate: draw });
        tl.fromTo(warp, { speed: 0, travel: 0 }, { speed: 0.5, travel: 0.9, duration: 0.7, ease: "power3.in" }, 0);
        tl.to(warp, { speed: 0.01, travel: 1.0, duration: 0.8, ease: "power3.out" }, 0.7);
        tl.to(warp, { travel: 1.04, duration: 2.5, ease: "none" }, 1.5);
        tl.fromTo(q(".flash"), { opacity: 0, scaleX: 0.1 }, { opacity: 1, scaleX: 1.4, duration: 0.2, ease: "power2.out" }, 0.6);
        tl.to(q(".flash"), { opacity: 0, duration: 0.4, ease: "power2.in" }, 0.8);
        tl.fromTo(q("h1"), { opacity: 0, scaleX: 1.6 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.7);
        tl.fromTo(q("p"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.15, ease: "power2.out" }, 0.8);
        tl.to(q(".words"), { opacity: 0, duration: 0.25, ease: "power2.in" }, 3.75);
        draw();
        window.__timelines = window.__timelines || {};
        window.__timelines["title"] = tl;
      })();
    </script>
  </div>
</template>
