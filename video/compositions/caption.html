<template id="caption-template">
  <div data-composition-id="caption" data-width="1920" data-height="1080" data-duration="4">
    <div class="bar">
      <span class="end left"></span>
      <strong class="text"></strong>
      <span class="end right"></span>
    </div>

    <style>
      [data-composition-id="caption"] { background: transparent; pointer-events: none; font-family: "Oswald", sans-serif; text-transform: uppercase; }
      [data-composition-id="caption"] .bar { position: absolute; left: 340px; top: 30px; display: flex; align-items: center; gap: 22px; height: 76px; padding: 0 10px; background: #000; border-radius: 38px; box-shadow: 0 0 0 4px #000; opacity: 0; }
      [data-composition-id="caption"] .end { width: 90px; height: 56px; background: #ff9c33; }
      [data-composition-id="caption"] .left { border-radius: 28px 0 0 28px; }
      [data-composition-id="caption"] .right { border-radius: 0 28px 28px 0; background: #9999ff; }
      [data-composition-id="caption"] .text { color: #ffcc99; font-size: 44px; font-weight: 600; letter-spacing: .12em; white-space: nowrap; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="caption"]');
        const values = window.__hyperframes?.getVariables?.() ?? {};
        root.querySelector(".text").textContent = values.text ?? "";
        const q = (selector) => root.querySelectorAll(selector);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(q(".bar"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0);
        tl.fromTo(q(".end"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, stagger: 0.08, ease: "power2.out" }, 0.1);
        tl.to(q(".bar"), { opacity: 0, duration: 0.3, ease: "power2.in" }, Math.min(4, values.length ?? 4) - 0.3);
        window.__timelines = window.__timelines || {};
        window.__timelines["caption"] = tl;
      })();
    </script>
  </div>
</template>
