<template id="specs-template">
  <div data-composition-id="specs" data-width="1920" data-height="1080" data-duration="5">
    <div class="frame">
      <div class="side">
        <span class="block orange"></span>
        <span class="block peach"></span>
        <span class="block lilac"></span>
        <span class="block blue"></span>
        <span class="block tan"></span>
      </div>
      <div class="top"><span>Ship’s specifications</span></div>
      <ol class="rows">
        <li><b>01</b>A full coding agent</li>
        <li><b>02</b>Built on OpenCode 2</li>
        <li><b>03</b>Any AI provider</li>
        <li><b>04</b>Your own projects</li>
        <li><b>05</b>Spoken orders. No typing.</li>
      </ol>
    </div>

    <style>
      [data-composition-id="specs"] { background: #000; overflow: hidden; font-family: "Oswald", sans-serif; text-transform: uppercase; }
      [data-composition-id="specs"] .frame { position: absolute; left: 120px; top: 110px; right: 120px; bottom: 110px; }
      [data-composition-id="specs"] .side { position: absolute; left: 0; top: 0; bottom: 0; width: 210px; display: grid; grid-template-rows: 150px repeat(4, 1fr); gap: 10px; }
      [data-composition-id="specs"] .block { display: block; }
      [data-composition-id="specs"] .block:first-child { border-radius: 70px 0 0 0; }
      [data-composition-id="specs"] .block:last-child { border-radius: 0 0 0 70px; }
      [data-composition-id="specs"] .orange { background: #ff9c33; }
      [data-composition-id="specs"] .peach { background: #ffcc99; }
      [data-composition-id="specs"] .lilac { background: #cc99cc; }
      [data-composition-id="specs"] .blue { background: #9999ff; }
      [data-composition-id="specs"] .tan { background: #d9a37c; }
      [data-composition-id="specs"] .top { position: absolute; left: 210px; right: 0; top: 0; height: 60px; background: #ff9c33; border-radius: 0 30px 30px 0; display: flex; justify-content: flex-end; align-items: center; padding-right: 40px; transform-origin: 0 50%; }
      [data-composition-id="specs"] .top span { color: #000; font-size: 40px; font-weight: 600; letter-spacing: .14em; }
      [data-composition-id="specs"] .rows { position: absolute; left: 290px; top: 140px; margin: 0; padding: 0; list-style: none; display: grid; gap: 30px; }
      [data-composition-id="specs"] li { display: flex; align-items: baseline; gap: 40px; color: #f2e6da; font-size: 82px; font-weight: 500; letter-spacing: .05em; line-height: 1.05; opacity: 0; }
      [data-composition-id="specs"] li b { color: #ff9c33; font-size: 44px; font-weight: 600; letter-spacing: .1em; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="specs"]');
        const q = (selector) => root.querySelectorAll(selector);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(q(".block"), { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.35, stagger: 0.06, ease: "power2.out" }, 0);
        tl.fromTo(q(".top"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.15);
        tl.fromTo(q("li"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.55, ease: "power2.out" }, 0.6);
        tl.to(q(".frame"), { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.6);
        window.__timelines = window.__timelines || {};
        window.__timelines["specs"] = tl;
      })();
    </script>
  </div>
</template>
