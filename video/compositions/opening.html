<template id="opening-template">
  <div data-composition-id="opening" data-width="1920" data-height="1080" data-duration="18">
    <canvas class="stars" width="1920" height="1080" data-layout-allow-overflow></canvas>

    <div class="log">
      <span class="cap"></span>
      <span class="log-title">Captain’s log</span>
      <span class="log-date">Stardate <b class="stardate"></b></span>
      <span class="log-bar"></span>
    </div>

    <div class="card actor">
      <p class="kicker">With deepest respect and gratitude</p>
      <h1>Sir Patrick Stewart</h1>
      <p class="years">1940 – 2026</p>
      <p class="line">Classical stage actor. He gave the captain his calm authority, his warmth, and his voice.</p>
    </div>

    <div class="card captain">
      <p class="kicker">Commanding officer · USS Enterprise</p>
      <h1>Captain Jean-Luc Picard</h1>
      <p class="line">Explorer. Diplomat. Lover of Shakespeare and ancient history. He thought aloud, and expected the truth.</p>
    </div>

    <div class="pair">
      <div class="pair-frame">
        <span class="elbow top"></span>
        <div class="pair-names">
          <span class="gold">Sir Patrick Stewart</span>
          <span class="dot"></span>
          <span class="lilac">Captain Jean-Luc Picard</span>
        </div>
        <span class="elbow bottom"></span>
      </div>
    </div>

    <style>
      [data-composition-id="opening"] { background: #000; overflow: hidden; font-family: "Oswald", sans-serif; }
      [data-composition-id="opening"] .stars { position: absolute; inset: 0; }
      [data-composition-id="opening"] .log { position: absolute; left: 150px; top: 150px; display: grid; grid-template-columns: 54px auto; grid-template-rows: auto auto 22px; column-gap: 26px; row-gap: 8px; opacity: 0; }
      [data-composition-id="opening"] .cap { grid-row: 1 / 4; background: #ffcc99; border-radius: 54px 0 0 54px; }
      [data-composition-id="opening"] .log-title { color: #ffcc99; font-size: 64px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
      [data-composition-id="opening"] .log-date { color: #ff9c33; font-size: 44px; letter-spacing: .14em; text-transform: uppercase; }
      [data-composition-id="opening"] .log-date b { color: #f2e6da; font-weight: 600; }
      [data-composition-id="opening"] .log-bar { width: 0; height: 22px; background: #cc99cc; border-radius: 0 11px 11px 0; }
      [data-composition-id="opening"] .card { position: absolute; left: 150px; right: 150px; top: 500px; opacity: 0; }
      [data-composition-id="opening"] .kicker { margin: 0 0 22px; color: #b8aa9c; font-size: 34px; letter-spacing: .18em; text-transform: uppercase; }
      [data-composition-id="opening"] h1 { margin: 0; white-space: nowrap; font-size: 132px; line-height: 1; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
      [data-composition-id="opening"] .actor h1 { color: #ffaa00; }
      [data-composition-id="opening"] .captain h1 { color: #cc99cc; }
      [data-composition-id="opening"] .years { margin: 18px 0 0; color: #ffcc99; font-size: 64px; letter-spacing: .14em; }
      [data-composition-id="opening"] .line { margin: 44px 0 0; max-width: 1400px; color: #f2e6da; font: 42px/1.45 "Inter", sans-serif; }
      [data-composition-id="opening"] .line .word { display: inline-block; opacity: 0; margin-right: .26em; }
      [data-composition-id="opening"] .pair { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
      [data-composition-id="opening"] .pair-frame { position: relative; padding: 70px 120px; }
      [data-composition-id="opening"] .elbow { position: absolute; left: 0; right: 0; height: 26px; background: #ff9c33; }
      [data-composition-id="opening"] .elbow.top { top: 0; border-radius: 26px 26px 0 0; }
      [data-composition-id="opening"] .elbow.bottom { bottom: 0; background: #9999ff; border-radius: 0 0 26px 26px; }
      [data-composition-id="opening"] .pair-names { display: flex; align-items: center; gap: 48px; white-space: nowrap; font-size: 68px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
      [data-composition-id="opening"] .gold { color: #ffaa00; }
      [data-composition-id="opening"] .lilac { color: #cc99cc; }
      [data-composition-id="opening"] .dot { width: 28px; height: 28px; border-radius: 50%; background: #ffcc99; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="opening"]');
        root.querySelector(".stardate").textContent = window.__hyperframes.getVariables().stardate;
        for (const line of root.querySelectorAll(".line")) {
          line.innerHTML = line.textContent.split(" ").map((word) => `<span class="word">${word}</span>`).join("");
        }

        let seed = 1701;
        const next = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const stars = Array.from({ length: 420 }, () => ({ x: next() * 1920, y: next() * 1080, z: 0.25 + next() * 0.75 }));
        const context = root.querySelector(".stars").getContext("2d");
        const sky = { drift: 0 };
        const draw = () => {
          context.fillStyle = "#000";
          context.fillRect(0, 0, 1920, 1080);
          for (const star of stars) {
            const x = (star.x - sky.drift * star.z * 120 + 1920) % 1920;
            context.globalAlpha = 0.35 + star.z * 0.65;
            context.fillStyle = "#f2e6da";
            context.fillRect(x, star.y, star.z * 2.4, star.z * 2.4);
          }
          context.globalAlpha = 1;
        };

        const q = (selector) => root.querySelectorAll(selector);
        const tl = gsap.timeline({ paused: true, onUpdate: draw });
        tl.fromTo(sky, { drift: 0 }, { drift: 1, duration: 18, ease: "none" }, 0);
        tl.fromTo(q(".log"), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0.4);
        tl.to(q(".log-bar"), { width: 520, duration: 1.4, ease: "power2.out" }, 0.9);
        tl.to(q(".log"), { opacity: 0.55, duration: 0.6 }, 4);

        tl.fromTo(q(".actor"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 4.1);
        tl.to(q(".actor .word"), { opacity: 1, duration: 0.25, stagger: 0.16 }, 5.0);
        tl.to(q(".actor"), { opacity: 0, y: -20, duration: 0.6, ease: "power2.in" }, 8.4);

        tl.fromTo(q(".captain"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 9.1);
        tl.to(q(".captain .word"), { opacity: 1, duration: 0.25, stagger: 0.16 }, 9.9);
        tl.to(q(".captain"), { opacity: 0, y: -20, duration: 0.6, ease: "power2.in" }, 13.4);
        tl.to(q(".log"), { opacity: 0, duration: 0.6 }, 13.4);

        tl.fromTo(q(".pair"), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 1, ease: "power2.out" }, 14.1);
        tl.to(q(".pair"), { opacity: 0, duration: 0.8, ease: "power2.in" }, 17.2);

        draw();
        window.__timelines = window.__timelines || {};
        window.__timelines["opening"] = tl;
      })();
    </script>
  </div>
</template>
