<template id="opening-template">
  <div data-composition-id="opening" data-width="1920" data-height="1080" data-duration="15">
    <canvas class="stars" width="1920" height="1080" data-layout-allow-overflow></canvas>

    <div class="log">
      <span class="cap"></span>
      <span class="log-title">Captain’s log</span>
      <span class="log-date">Stardate <b class="stardate"></b></span>
      <span class="log-bar"></span>
    </div>

    <div class="hook">
      <h1 class="beat one">The Captain never typed.</h1>
      <h1 class="beat two"><span class="word">He</span> <span class="word">spoke.</span> <span class="word">The</span> <span class="word">computer</span> <span class="word">answered.</span></h1>
      <h1 class="beat three">So we built <em>Picard Code.</em></h1>
    </div>

    <div class="dedication">
      <div class="frame">
        <span class="elbow top"></span>
        <p class="brand">Picard Code</p>
        <p class="kicker">A tribute to</p>
        <p class="actor">Sir Patrick Stewart</p>
        <p class="years">1940 – 2026</p>
        <p class="and">and</p>
        <p class="captain">Captain Jean-Luc Picard</p>
        <span class="elbow bottom"></span>
      </div>
    </div>

    <style>
      [data-composition-id="opening"] { background: #000; overflow: hidden; font-family: "Oswald", sans-serif; }
      [data-composition-id="opening"] .stars { position: absolute; inset: 0; }
      [data-composition-id="opening"] .log { position: absolute; left: 150px; top: 130px; display: grid; grid-template-columns: 54px auto; grid-template-rows: auto auto 22px; column-gap: 26px; row-gap: 8px; opacity: 0; }
      [data-composition-id="opening"] .cap { grid-row: 1 / 4; background: #ffcc99; border-radius: 54px 0 0 54px; }
      [data-composition-id="opening"] .log-title { color: #ffcc99; font-size: 58px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
      [data-composition-id="opening"] .log-date { color: #ff9c33; font-size: 40px; letter-spacing: .14em; text-transform: uppercase; }
      [data-composition-id="opening"] .log-date b { color: #f2e6da; font-weight: 600; }
      [data-composition-id="opening"] .log-bar { width: 0; height: 22px; background: #cc99cc; border-radius: 0 11px 11px 0; }
      [data-composition-id="opening"] .hook { position: absolute; left: 150px; right: 150px; top: 470px; height: 300px; }
      [data-composition-id="opening"] .beat { position: absolute; left: 0; top: 0; margin: 0; color: #ffaa00; font-size: 124px; font-weight: 600; line-height: 1.05; letter-spacing: .02em; text-transform: uppercase; opacity: 0; }
      [data-composition-id="opening"] .beat.two { color: #f2e6da; }
      [data-composition-id="opening"] .beat.two .word { display: inline-block; opacity: 0; }
      [data-composition-id="opening"] .beat.three em { font-style: normal; color: #ff9c33; }
      [data-composition-id="opening"] .dedication { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
      [data-composition-id="opening"] .frame { position: relative; padding: 80px 160px; text-align: center; }
      [data-composition-id="opening"] .elbow { position: absolute; left: 0; right: 0; height: 26px; background: #ff9c33; }
      [data-composition-id="opening"] .elbow.top { top: 0; border-radius: 26px 26px 0 0; }
      [data-composition-id="opening"] .elbow.bottom { bottom: 0; background: #9999ff; border-radius: 0 0 26px 26px; }
      [data-composition-id="opening"] .frame p { margin: 0; text-transform: uppercase; white-space: nowrap; }
      [data-composition-id="opening"] .brand { margin: 0 -.32em 26px 0; color: #ff9c33; font-size: 64px; font-weight: 600; letter-spacing: .32em; }
      [data-composition-id="opening"] .kicker, [data-composition-id="opening"] .and { color: #b8aa9c; font-size: 36px; letter-spacing: .2em; }
      [data-composition-id="opening"] .kicker { margin-bottom: 18px; }
      [data-composition-id="opening"] .actor { color: #ffaa00; font-size: 112px; font-weight: 600; line-height: 1.05; letter-spacing: .03em; }
      [data-composition-id="opening"] .years { margin: 6px 0 22px; color: #ffcc99; font-size: 54px; letter-spacing: .14em; }
      [data-composition-id="opening"] .and { margin-bottom: 10px; }
      [data-composition-id="opening"] .captain { color: #cc99cc; font-size: 76px; font-weight: 600; letter-spacing: .04em; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="opening"]');
        root.querySelector(".stardate").textContent = window.__hyperframes.getVariables().stardate;

        let seed = 1701;
        const next = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const stars = Array.from({ length: 420 }, () => ({ x: next() * 1920, y: next() * 1080, z: 0.25 + next() * 0.75 }));
        const context = root.querySelector(".stars").getContext("2d");
        const sky = { drift: 0 };
        const draw = () => {
          context.fillStyle = "#000";
          context.fillRect(0, 0, 1920, 1080);
          for (const star of stars) {
            const x = (star.x - sky.drift * star.z * 120 + 1920) % 1920;
            context.globalAlpha = 0.35 + star.z * 0.65;
            context.fillStyle = "#f2e6da";
            context.fillRect(x, star.y, star.z * 2.4, star.z * 2.4);
          }
          context.globalAlpha = 1;
        };

        // The beats come from BEATS in video/edit.mjs: the dedication first, then each line while the Captain says it.
        const beats = window.__hyperframes.getVariables().beats;
        const [, dedicationEnd] = beats.dedication;
        const [oneStart, oneEnd] = beats["hook-1"];
        const [twoStart, twoEnd] = beats["hook-2"];
        const [threeStart, threeEnd] = beats["hook-3"];
        const q = (selector) => root.querySelectorAll(selector);
        const tl = gsap.timeline({ paused: true, onUpdate: draw });
        tl.fromTo(sky, { drift: 0 }, { drift: 1, duration: 15, ease: "none" }, 0);

        // On screen from the first frame, so the tribute is what people see first.
        tl.fromTo(q(".dedication"), { opacity: 1, scale: 0.98 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0);
        tl.to(q(".dedication"), { opacity: 0, duration: 0.5, ease: "power2.in" }, dedicationEnd - 0.5);

        tl.fromTo(q(".log"), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, oneStart - 0.15);
        tl.fromTo(q(".log-bar"), { width: 0 }, { width: 520, duration: 0.8, ease: "power2.out" }, oneStart + 0.05);

        tl.fromTo(q(".one"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, oneStart - 0.15);
        tl.to(q(".one"), { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" }, oneEnd - 0.15);

        tl.set(q(".two"), { opacity: 1 }, twoStart - 0.05);
        tl.fromTo(q(".two .word"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.32, ease: "power2.out" }, twoStart - 0.05);
        tl.to(q(".two"), { opacity: 0, y: -16, duration: 0.35, ease: "power2.in" }, twoEnd - 0.3);

        tl.fromTo(q(".three"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, threeStart - 0.1);
        tl.to(q(".three"), { opacity: 0, y: -16, duration: 0.4, ease: "power2.in" }, threeEnd);
        tl.to(q(".log"), { opacity: 0, duration: 0.4 }, threeEnd);

        draw();
        window.__timelines = window.__timelines || {};
        window.__timelines["opening"] = tl;
      })();
    </script>
  </div>
</template>
