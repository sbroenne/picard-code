<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picard Code video thumbnail</title>
<style>
  @font-face { font-family: "LCARS"; src: local("Avenir Next Condensed Demi Bold"), local("AvenirNextCondensed-DemiBold"); }
  html, body { margin: 0; background: #000; }
  #thumbnail { position: relative; width: 1280px; height: 720px; overflow: hidden;
    color: #ffcc99; font-family: "LCARS", sans-serif; text-transform: uppercase; background: #000; }
  .rail { position: absolute; left: 36px; top: 36px; width: 1208px; height: 16px; border-radius: 8px; background: #ff9c33; }
  h1 { position: absolute; left: 60px; top: 78px; margin: 0; color: #ff9c33; font-size: 106px; line-height: 1; letter-spacing: .04em; }
  .order { position: absolute; left: 60px; top: 240px; width: 400px; margin: 0; font-size: 68px; line-height: 1.1; }
  .tribute { position: absolute; left: 60px; top: 470px; width: 390px; margin: 0; font-size: 29px; line-height: 1.3; color: #cc99cc; }
  .screen { position: absolute; left: 480px; top: 185px; width: 770px; height: 535px; object-fit: contain; }
  .note { position: absolute; left: 60px; top: 645px; margin: 0; color: #ffcc99; font-size: 20px; letter-spacing: .06em; }
</style>
</head>
<body>
<div id="thumbnail" data-composition-id="thumbnail" data-start="0" data-duration="1" data-width="1280" data-height="720">
  <div class="rail"></div>
  <h1>Picard Code</h1>
  <p class="order">Say<br>“Computer.”</p>
  <p class="tribute">An unofficial tribute to<br>Sir Patrick Stewart<br>and Captain Jean-Luc Picard</p>
  <img class="screen" src="assets/console.png" alt="Current interface with a staged bridge-crew exchange.">
  <p class="note">No typing. Just your voice.<br>Staged example on screen.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>window.__timelines = { thumbnail: gsap.timeline({ paused: true }).to({}, { duration: 1 }) };</script>
</body>
</html>
