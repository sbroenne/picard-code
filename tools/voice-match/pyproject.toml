[project]
name = "picard-voice-match"
version = "0.1.0"
description = "Measures which ready-made voices sound closest to reference clips. Used to choose Picard Code's bridge officer voices."
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "numpy>=1.26",
  "scipy>=1.13",
  "librosa>=0.10",
  "soundfile>=0.12",
  "speechbrain>=1.0",
  "onnxruntime>=1.18",
  "huggingface_hub>=0.24",
  "transformers>=4.44",
]

[tool.uv]
package = false
